[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wanxing-ops-mcp"
version = "0.1.0"
description = "萬星（wanxing 线）舰队操作 MCP：目录/卡片/允许清单/启停/回合，双凭据分型（平台令牌+caller key）。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastmcp>=2.0",
    "click",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
wanxing-ops-mcp = "wanxing_ops_mcp.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["wanxing_ops_mcp*"]
