[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facet-ops-mcp"
version = "0.1.0"
description = "谦面（facet 线）市场操作 MCP：目录/详情/发布/更新/上下架/查重，逐调用以用户身份委托执行。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "FindDataTechnology" }]
dependencies = [
    "fastmcp>=2.0",
    "click",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
facet-ops-mcp = "facet_ops_mcp.cli:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["facet_ops_mcp*"]
